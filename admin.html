<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARC 顧問ダッシュボード</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@700;900&family=DM+Mono:wght@400;500&display=swap');
:root {
  --navy:#0f2044; --navy-mid:#1a3560; --navy-lt:#2a5298; --navy-pale:#e8eef8;
  --gold:#c8952a; --gold-pale:#fdf3dc;
  --green:#0a7c5c; --green-pale:#e6f5f0;
  --red:#c0392b; --red-pale:#fdecea;
  --amber:#c07000; --amber-pale:#fff3e0;
  --ink:#0f2044; --ink-soft:#3d5278; --ink-muted:#7a8ea8;
  --bg:#f2f5fa; --surface:#fff; --border:#dde4f0; --border-lt:#edf0f7;
  --shadow:0 1px 3px rgba(15,32,68,.07),0 2px 8px rgba(15,32,68,.05);
  --shadow-md:0 4px 16px rgba(15,32,68,.10);
  --r:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
.hdr{background:var(--navy);height:56px;display:flex;align-items:center;padding:0 20px;gap:14px;box-shadow:0 2px 12px rgba(15,32,68,.3);position:sticky;top:0;z-index:100}
.hdr-logo{font-family:'Noto Serif JP',serif;font-size:18px;font-weight:900;color:#fff;letter-spacing:.06em;flex:1}
.hdr-logo span{color:var(--gold)}
.hdr-update{font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,.3);letter-spacing:.08em}
.hdr-btn{padding:7px 16px;border-radius:999px;border:none;font-family:'Noto Sans JP',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;background:var(--gold);color:var(--navy)}
.hdr-btn:hover{filter:brightness(1.1)}
.hdr-btn:disabled{opacity:.5;cursor:not-allowed}
.hdr-print{padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);font-family:'Noto Sans JP',sans-serif;font-size:12px;cursor:pointer}

/* ── TABS ── */
.tab-bar{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;gap:0;position:sticky;top:56px;z-index:90}
.tab-btn{padding:14px 20px;border:none;background:transparent;font-family:'Noto Sans JP',sans-serif;font-size:13px;font-weight:600;color:var(--ink-muted);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--navy)}
.tab-btn:hover:not(.active){color:var(--ink-soft)}
.tab-panel{display:none}.tab-panel.active{display:block}

/* ── CONTENT ── */
.content{padding:20px;max-width:1100px;margin:0 auto}

/* ── KPI ── */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);border-top:3px solid var(--navy-lt)}
.kpi.gold{border-top-color:var(--gold)}.kpi.green{border-top-color:var(--green)}.kpi.red{border-top-color:var(--red)}
.kpi-icon{font-size:18px;margin-bottom:6px;opacity:.7}
.kpi-val{font-family:'DM Mono',monospace;font-size:28px;font-weight:500;color:var(--navy);line-height:1}
.kpi.gold .kpi-val{color:var(--gold)}.kpi.green .kpi-val{color:var(--green)}.kpi.red .kpi-val{color:var(--red)}
.kpi-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);margin-top:4px}

/* ── STATUS TABLE ── */
.status-table{width:100%;border-collapse:collapse;font-size:13px}
.status-table th{background:var(--navy);color:rgba(255,255,255,.8);padding:10px 14px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.status-table td{padding:10px 14px;border-bottom:1px solid var(--border-lt)}
.status-table tr:last-child td{border-bottom:none}
.status-table tr:hover td{background:var(--bg)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:10px;font-weight:700}
.badge-ok{background:var(--green-pale);color:var(--green)}
.badge-no{background:var(--border-lt);color:var(--ink-muted)}
.achieve-val{font-family:'DM Mono',monospace;font-weight:700}
.av-1{color:#DC2626}.av-2{color:#D97706}.av-3{color:#A16207}.av-4{color:#16A34A}.av-5{color:#15803D}

/* ── CARDS ── */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--border-lt)}
.card-hdr{background:var(--navy-mid);padding:12px 14px;display:flex;align-items:center;gap:10px}
.card-hdr.reflect{background:linear-gradient(135deg,var(--green),#047857)}
.card-av{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-name{font-size:13px;font-weight:700;color:#fff;flex:1}
.card-meta{font-size:10px;color:rgba(255,255,255,.55);margin-top:1px}
.card-body{padding:12px 14px}
.card-section{margin-bottom:8px}
.card-section:last-child{margin-bottom:0}
.card-sec-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.lbl-declare{color:var(--navy-lt)}.lbl-scene{color:var(--ink-muted)}.lbl-why{color:var(--gold)}
.chip{padding:7px 10px;border-radius:0 6px 6px 0;font-size:12px;line-height:1.6}
.chip-declare{background:var(--navy-pale);border-left:3px solid var(--navy-lt);color:var(--navy-mid);font-weight:500}
.chip-scene{background:#f8fafc;border-left:3px solid var(--border);color:var(--ink-soft)}
.chip-why{background:var(--gold-pale);border-left:3px solid var(--gold);color:var(--ink-soft)}
.achieve-pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700}
.ap-1{background:#FEE2E2;color:#DC2626}.ap-2{background:#FEF3C7;color:#D97706}
.ap-3{background:#FEF9C3;color:#A16207}.ap-4{background:#DCFCE7;color:#16A34A}.ap-5{background:#BBF7D0;color:#15803D}

/* ── MASTER-DETAIL ── */
.md-layout{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}
.member-list-box{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.ml-header{padding:10px 14px;background:var(--navy);color:rgba(255,255,255,.7);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.ml-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border-lt);transition:background .15s}
.ml-item:last-child{border-bottom:none}
.ml-item:hover{background:var(--bg)}
.ml-item.active{background:var(--navy-pale)}
.ml-name{font-size:13px;font-weight:600;color:var(--ink);flex:1}
.ml-sub{font-size:10px;color:var(--ink-muted)}
.detail-box{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.detail-hdr{background:var(--navy);padding:16px 20px;display:flex;align-items:center;gap:14px}
.detail-av{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.detail-name{font-size:17px;font-weight:700;color:#fff}
.detail-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}
.detail-body{padding:20px}
.detail-section{margin-bottom:20px}
.detail-section:last-child{margin-bottom:0}
.dsec-title{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border-lt)}

/* ── BARS ── */
.bars-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bars-row{display:flex;align-items:center;gap:8px}
.bars-lbl{font-size:10px;color:var(--ink-soft);width:64px;flex-shrink:0}
.bars-track{flex:1;background:var(--border-lt);border-radius:999px;height:5px}
.bars-fill{height:5px;border-radius:999px;background:var(--navy-lt);transition:width .5s}
.bars-num{font-size:9px;font-family:'DM Mono',monospace;color:var(--ink-muted);width:18px;text-align:right}

/* ── MATRIX ── */
.mtx-wrap{overflow-x:auto}
.mtx{border-collapse:collapse;width:100%;min-width:400px}
.mtx th{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);padding:8px 4px;text-align:center;border-bottom:2px solid var(--border)}
.mtx th.n{text-align:left;padding-left:12px}
.mtx td{padding:4px 3px;text-align:center}
.mtx td.n{text-align:left;padding-left:12px;font-size:12px;font-weight:600;color:var(--navy);white-space:nowrap;border-right:1px solid var(--border-lt)}
.mtx tr:hover td{background:rgba(15,32,68,.02)}
.mc{width:26px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;margin:0 auto}
.mc-1{background:#FEE2E2;color:#DC2626}.mc-2{background:#FEF3C7;color:#D97706}
.mc-3{background:#FEF9C3;color:#A16207}.mc-4{background:#DCFCE7;color:#16A34A}
.mc-5{background:#BBF7D0;color:#15803D}.mc-ok{background:var(--navy-pale);color:var(--navy-lt)}
.mc-nil{background:var(--border-lt);color:var(--ink-muted)}

/* ── CHART ROW ── */
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.chart-box{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.chart-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px}

/* ── FILTER ── */
.filter-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-label{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
.filter-input{padding:7px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:'Noto Sans JP',sans-serif;color:var(--ink);background:var(--surface);outline:none}
.filter-input:focus{border-color:var(--navy-lt)}
.filter-btn{padding:7px 14px;border-radius:7px;border:none;font-family:'Noto Sans JP',sans-serif;font-size:12px;font-weight:700;cursor:pointer}
.fb-week{background:var(--navy-pale);color:var(--navy-mid)}
.fb-clear{background:var(--border-lt);color:var(--ink-soft)}

/* ── SECTION BOX ── */
.sbox{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.sbox-hdr{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border-lt);gap:8px}
.sbox-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);flex:1}
.sbox-meta{font-size:11px;color:var(--ink-muted)}
.sbox-body{padding:16px}

/* ── ALERT ── */
.alert-bar{padding:10px 20px;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;color:#fff}
.alert-bar.red{background:linear-gradient(90deg,#c0392b,#e74c3c)}
.alert-bar.amber{background:linear-gradient(90deg,#c07000,#e67e00)}
.alert-bar.hidden{display:none}

/* ── EMPTY / LOADING ── */
.empty{text-align:center;padding:40px 20px;color:var(--ink-muted)}
.empty-icon{font-size:36px;margin-bottom:8px}
.empty-text{font-size:12px;line-height:1.8}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--navy-lt);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .kpi-row{grid-template-columns:repeat(2,1fr);gap:8px}
  .kpi-val{font-size:22px}
  .chart-row{grid-template-columns:1fr}
  .md-layout{grid-template-columns:1fr}
  .tab-btn{padding:12px 12px;font-size:12px}
  .content{padding:12px}
  .cards-grid{grid-template-columns:1fr}
  .bars-grid{grid-template-columns:1fr}
}
@media print{
  .hdr .hdr-btn,.hdr .hdr-print,.tab-bar,.filter-row{display:none!important}
  body{background:#fff}
  .card,.sbox,.kpi,.detail-box,.chart-box{box-shadow:none;border:1px solid #ddd}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-logo">⚔ <span>MARC</span> ダッシュボード</div>
  <div class="hdr-update" id="hdrUpdate">未収集</div>
  <button class="hdr-btn" id="collectBtn">🔄 データを収集</button>
  <button class="hdr-print" onclick="window.print()">🖨</button>
</div>

<div class="alert-bar hidden" id="alertBar"></div>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="week">📋 今週の状況</button>
  <button class="tab-btn" data-tab="member">👤 部員別詳細</button>
  <button class="tab-btn" data-tab="trend">📊 傾向・分析</button>
</div>

<!-- ===== 今週の状況 ===== -->
<div class="tab-panel active" id="tab-week">
  <div class="content">
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-icon">✊</div><div class="kpi-val" id="k-declare">—</div><div class="kpi-label">チャレンジ宣言（今週）</div></div>
      <div class="kpi green"><div class="kpi-icon">🔍</div><div class="kpi-val" id="k-reflect">—</div><div class="kpi-label">振り返り（今週）</div></div>
      <div class="kpi gold"><div class="kpi-icon">⭐</div><div class="kpi-val" id="k-achieve">—</div><div class="kpi-label">平均達成感（今週）</div></div>
      <div class="kpi red"><div class="kpi-icon">⚠</div><div class="kpi-val" id="k-missing">—</div><div class="kpi-label">振り返り未提出</div></div>
    </div>

    <div class="sbox">
      <div class="sbox-hdr">
        <div class="sbox-title">部員ステータス（今週）</div>
        <div class="sbox-meta" id="weekRange"></div>
      </div>
      <div class="sbox-body" style="padding:0;overflow-x:auto;">
        <table class="status-table" id="statusTable">
          <thead><tr><th>部員</th><th>宣言</th><th>振り返り</th><th>達成感</th><th>チャレンジ内容</th></tr></thead>
          <tbody id="statusTableBody"><tr><td colspan="5"><div class="empty"><div class="spinner"></div>データを収集してください</div></td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="sbox">
      <div class="sbox-hdr"><div class="sbox-title">今週の振り返り</div></div>
      <div class="sbox-body">
        <div class="cards-grid" id="weekReflectCards">
          <div class="empty" style="grid-column:1/-1"><div class="empty-icon">🔍</div><div class="empty-text">データを収集してください</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===== 部員別詳細 ===== -->
<div class="tab-panel" id="tab-member">
  <div class="content">
    <div class="md-layout">
      <div class="member-list-box">
        <div class="ml-header">部員一覧</div>
        <div id="memberListItems"><div class="empty"><div class="empty-text">データを収集してください</div></div></div>
      </div>
      <div class="detail-box" id="memberDetail">
        <div class="empty" style="padding:60px 20px"><div class="empty-icon">👈</div><div class="empty-text">左の部員を選択してください</div></div>
      </div>
    </div>
  </div>
</div>

<!-- ===== 傾向・分析 ===== -->
<div class="tab-panel" id="tab-trend">
  <div class="content">
    <div class="chart-row">
      <div class="chart-box">
        <div class="chart-title">達成感の分布（部員ごとの最新）</div>
        <canvas id="achieveChart" style="max-height:180px"></canvas>
      </div>
      <div class="chart-box">
        <div class="chart-title">部員別 振り返り件数（全期間）</div>
        <canvas id="memberChart" style="max-height:180px"></canvas>
      </div>
    </div>
    <div class="sbox">
      <div class="sbox-hdr">
        <div class="sbox-title">部員マトリクス</div>
        <div class="sbox-meta">セル色 = 達成感スコア / ✓ = 宣言のみ / — = 未記録</div>
      </div>
      <div class="sbox-body">
        <div class="mtx-wrap" id="matrixWrap"><div class="empty"><div class="empty-text">データを収集してください</div></div></div>
      </div>
    </div>

    <div class="sbox">
      <div class="sbox-hdr"><div class="sbox-title">振り返り一覧</div></div>
      <div class="sbox-body" style="padding-bottom:0">
        <div class="filter-row">
          <div class="filter-group"><label class="filter-label">開始日</label><input type="date" class="filter-input" id="dateFrom"></div>
          <div style="display:flex;align-items:flex-end;color:var(--ink-muted);font-weight:700;padding-bottom:2px">〜</div>
          <div class="filter-group"><label class="filter-label">終了日</label><input type="date" class="filter-input" id="dateTo"></div>
          <button class="filter-btn fb-week" id="btnWeek">今週</button>
          <button class="filter-btn fb-clear" id="btnClear">クリア</button>
        </div>
      </div>
      <div class="sbox-body" style="padding-top:0">
        <div class="cards-grid" id="allReflectCards"><div class="empty" style="grid-column:1/-1"><div class="empty-text">データを収集してください</div></div></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── GAS URL ──
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzXBg6OL5atDmBE2wKALDLo1DpWEgSGSFFYBhweJknRqTPRKQGhLo1-F_2x4kT8p_VNww/exec';

// ── ストア ──
let store = { declares:[], reflects:[], profiles:[] };
let charts = {};

// ── 全イベント委譲（inline onclick不使用）──
document.addEventListener('click', function(e) {
  const t = e.target;

  // タブ切り替え
  const tabBtn = t.closest('[data-tab]');
  if(tabBtn) {
    const id = tabBtn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === tabBtn));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + id));
    if(id === 'trend') renderTrend();
    return;
  }

  // データ収集ボタン
  if(t.id === 'collectBtn') { collectAll(); return; }

  // フィルターボタン
  if(t.id === 'btnWeek') { setWeekRange(); renderAllReflect(); return; }
  if(t.id === 'btnClear') { document.getElementById('dateFrom').value=''; document.getElementById('dateTo').value=''; renderAllReflect(); return; }

  // 部員リストクリック
  const mlItem = t.closest('.ml-item');
  if(mlItem) {
    document.querySelectorAll('.ml-item').forEach(i => i.classList.remove('active'));
    mlItem.classList.add('active');
    showMemberDetail(mlItem.dataset.name);
    return;
  }
});

// 日付フィルター変更
document.getElementById('dateFrom').addEventListener('change', renderAllReflect);
document.getElementById('dateTo').addEventListener('change', renderAllReflect);

// ── JSONP ──
function fetchGAS(params) {
  return new Promise((resolve, reject) => {
    const cb = '_cb_' + Date.now() + '_' + Math.floor(Math.random()*10000);
    const sc = document.createElement('script');
    let url = GAS_URL + '?callback=' + cb;
    Object.entries(params).forEach(([k,v]) => url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(v));
    const timer = setTimeout(() => { cleanup(); reject('timeout'); }, 15000);
    function cleanup() { clearTimeout(timer); delete window[cb]; try{document.head.removeChild(sc);}catch(e){} }
    window[cb] = json => { cleanup(); json.status==='ok' ? resolve(json.rows||[]) : reject(json.message||'error'); };
    sc.onerror = () => { cleanup(); reject('load error'); };
    sc.src = url;
    document.head.appendChild(sc);
  });
}

// ── 収集 ──
async function collectAll() {
  const btn = document.getElementById('collectBtn');
  btn.disabled = true; btn.textContent = '⏳ 収集中…';
  try {
    store.declares = await fetchGAS({ action:'getAll', type:'チャレンジ宣言' });
    store.reflects  = await fetchGAS({ action:'getAll', type:'稽古ログ' });
    store.profiles  = await fetchGAS({ action:'getAll', type:'自己理解' });
    const now = new Date().toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    document.getElementById('hdrUpdate').textContent = now + ' 収集';
    renderWeek();
    renderMemberList();
    renderAlerts();
  } catch(e) { alert('取得失敗: ' + e); }
  btn.disabled = false; btn.textContent = '🔄 データを収集';
}

// ── 共通ユーティリティ ──
function normDate(v) { return String(v||'').replace(/\//g,'-').slice(0,10); }
function thisWeekRange() {
  const today = new Date(), day = today.getDay();
  const mon = new Date(today); mon.setDate(today.getDate()-(day===0?6:day-1));
  return { from: mon.toISOString().slice(0,10), to: today.toISOString().slice(0,10) };
}
function setWeekRange() {
  const r = thisWeekRange();
  document.getElementById('dateFrom').value = r.from;
  document.getElementById('dateTo').value = r.to;
}
function filterByRange(rows, from, to) {
  if(!from && !to) return rows;
  return rows.filter(r => {
    const d = normDate(r.date || r['稽古日']);
    if(from && d < from) return false;
    if(to   && d > to)   return false;
    return true;
  });
}
function latestPerMember(rows) {
  const seen = new Set(), out = [];
  const sorted = rows.slice().sort((a,b) => normDate(b.date||b['稽古日']).localeCompare(normDate(a.date||a['稽古日'])));
  sorted.forEach(r => { const n=r['氏名']||r.name||''; if(!seen.has(n)){seen.add(n);out.push(r);} });
  return out;
}
const fL = ['','できなかった','少しできた','まあまあ','かなり','完全に'];
const apClass = ['','ap-1','ap-2','ap-3','ap-4','ap-5'];
function getScore(row) { return parseInt(String(row.fulfillment||row['充実度']||'').replace('/5',''))||0; }
function getName(row) { return row['氏名']||row.name||'—'; }

// ── 今週の状況 ──
function renderWeek() {
  const wr = thisWeekRange();
  document.getElementById('weekRange').textContent = wr.from + ' 〜 ' + wr.to;

  const wDeclares = filterByRange(store.declares, wr.from, wr.to);
  const wReflects = filterByRange(store.reflects,  wr.from, wr.to);

  document.getElementById('k-declare').textContent = wDeclares.length;
  document.getElementById('k-reflect').textContent = wReflects.length;

  const scores = wReflects.map(getScore).filter(s=>s>0);
  document.getElementById('k-achieve').textContent = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : '—';

  // 未提出（宣言したが振り返りのない部員）
  const declaredNames = new Set(wDeclares.map(getName));
  const reflectedNames = new Set(wReflects.map(getName));
  const missing = [...declaredNames].filter(n => !reflectedNames.has(n));
  document.getElementById('k-missing').textContent = missing.length;

  // ステータステーブル
  const allMembers = [...new Set([...store.declares,...store.reflects,...store.profiles].map(getName).filter(n=>n!=='—'))].sort();
  const latestDeclare = {};
  wDeclares.forEach(r => { const n=getName(r); if(!latestDeclare[n]) latestDeclare[n]=r; });
  const latestReflect = {};
  wReflects.forEach(r => { const n=getName(r); if(!latestReflect[n]) latestReflect[n]=r; });

  const tbody = document.getElementById('statusTableBody');
  if(!allMembers.length) {
    tbody.innerHTML = '<tr><td colspan="5"><div class="empty"><div class="empty-text">データがありません</div></div></td></tr>';
  } else {
    tbody.innerHTML = allMembers.map(name => {
      const d = latestDeclare[name];
      const r = latestReflect[name];
      const f = r ? getScore(r) : 0;
      const avHtml = f ? `<span class="achieve-val av-${f}">${fL[f]}</span>` : '—';
      return `<tr>
        <td style="font-weight:600">${name}</td>
        <td>${d?'<span class="badge badge-ok">✓ 宣言</span>':'<span class="badge badge-no">未</span>'}</td>
        <td>${r?'<span class="badge badge-ok">✓ 提出</span>':'<span class="badge badge-no">未</span>'}</td>
        <td>${avHtml}</td>
        <td style="font-size:12px;color:var(--ink-soft);max-width:300px;">${d?d['試したいこと']||d.intent||'—':'—'}</td>
      </tr>`;
    }).join('');
  }

  // 今週の振り返りカード
  const wrc = document.getElementById('weekReflectCards');
  if(!wReflects.length) {
    wrc.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🔍</div><div class="empty-text">今週の振り返りはまだありません</div></div>';
  } else {
    wrc.innerHTML = wReflects.map(r => buildReflectCard(r)).join('');
  }
}

// ── 部員別詳細 ──
function renderMemberList() {
  const latest = {};
  store.profiles.forEach(r => { latest[getName(r)] = r; });
  const allNames = [...new Set([...store.declares,...store.reflects,...store.profiles].map(getName).filter(n=>n!=='—'))].sort();
  const el = document.getElementById('memberListItems');
  if(!allNames.length) {
    el.innerHTML = '<div class="empty"><div class="empty-text">データがありません</div></div>';
    return;
  }
  el.innerHTML = allNames.map(name => {
    const p = latest[name];
    return `<div class="ml-item" data-name="${name}">
      <div class="card-av" style="background:var(--navy-lt);font-size:12px">${name.charAt(0)}</div>
      <div><div class="ml-name">${name}</div><div class="ml-sub">${p?p['学年']||'':''} ${p?p['段位級']||'':''}</div></div>
    </div>`;
  }).join('');
}

function showMemberDetail(name) {
  const latest = {};
  store.profiles.forEach(r => { const n=getName(r); if(!latest[n]) latest[n]=r; });
  const p = latest[name];
  const memberReflects = store.reflects.filter(r=>getName(r)===name).slice().sort((a,b)=>normDate(b.date||b['稽古日']).localeCompare(normDate(a.date||a['稽古日'])));
  const memberDeclares = store.declares.filter(r=>getName(r)===name).slice().sort((a,b)=>normDate(b.date||b['稽古日']).localeCompare(normDate(a.date||a['稽古日'])));

  const barsKeys = [
    {k:'自己評価_kire',lb:'打突の冴え'},{k:'自己評価_tenouchi',lb:'手の内'},{k:'自己評価_zanshin',lb:'残心'},
    {k:'自己評価_maai',lb:'間合い'},{k:'自己評価_seme',lb:'攻め'},{k:'自己評価_kikai',lb:'機会'},
    {k:'自己評価_footwork',lb:'足さばき'},{k:'自己評価_shiai',lb:'試合運び'},
    {k:'自己評価_kisei',lb:'気勢'},{k:'自己評価_mental',lb:'精神力'}
  ];

  const barsHtml = p ? '<div class="bars-grid">' + barsKeys.map(b => {
    const v = parseInt(p[b.k])||0;
    return `<div class="bars-row"><div class="bars-lbl">${b.lb}</div><div class="bars-track"><div class="bars-fill" style="width:${v/5*100}%"></div></div><div class="bars-num">${v}/5</div></div>`;
  }).join('') + '</div>' : '<div class="empty"><div class="empty-text">自己理解データなし</div></div>';

  const reflectHistory = memberReflects.length ? memberReflects.map(r => {
    const f = getScore(r); const d = normDate(r.date||r['稽古日']);
    return `<div style="padding:10px 0;border-bottom:1px solid var(--border-lt);">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-muted)">${d}</span>
        ${f?`<span class="achieve-pill ${apClass[f]}">${fL[f]}</span>`:''}
      </div>
      ${r.intent||r['試したいこと']?`<div class="chip chip-declare" style="margin-bottom:6px;display:block">✊ ${r.intent||r['試したいこと']}</div>`:''}
      <div class="chip chip-scene" style="margin-bottom:4px;display:block">① ${r.scene||r['印象に残った場面']||'—'}</div>
      <div class="chip chip-why" style="display:block">② ${r.why||r['なぜそうなったか']||'—'}</div>
    </div>`;
  }).join('') : '<div class="empty"><div class="empty-text">振り返りデータなし</div></div>';

  document.getElementById('memberDetail').innerHTML = `
    <div class="detail-hdr">
      <div class="detail-av">${name.charAt(0)}</div>
      <div>
        <div class="detail-name">${name}</div>
        <div class="detail-sub">${p?`${p['学年']||''} / ${p['段位級']||''} / 剣道歴${p['剣道歴']||'—'} / 得意技：${p['得意技']||'—'}`:'プロフィールなし'}</div>
      </div>
    </div>
    <div class="detail-body">
      ${p?`<div class="detail-section">
        <div class="dsec-title">自己評価（BARS）</div>
        ${barsHtml}
      </div>
      <div class="detail-section">
        <div class="dsec-title">課題感</div>
        <div class="chip chip-why" style="display:block">${p['今の課題感']||'—'}</div>
      </div>
      <div class="detail-section">
        <div class="dsec-title">個人目標</div>
        <div class="chip chip-declare" style="display:block">🎯 ${p['個人目標']||'—'}</div>
      </div>`:''}
      <div class="detail-section">
        <div class="dsec-title">振り返り履歴（${memberReflects.length}件）</div>
        ${reflectHistory}
      </div>
    </div>`;
}

// ── 傾向・分析 ──
function renderTrend() {
  // 達成感分布
  const latest = latestPerMember(store.reflects);
  const dist = [0,0,0,0,0];
  latest.forEach(r => { const f=getScore(r); if(f>=1&&f<=5) dist[f-1]++; });
  const ac = document.getElementById('achieveChart');
  if(charts.achieve) charts.achieve.destroy();
  charts.achieve = new Chart(ac, {
    type:'bar',
    data:{ labels:['1','2','3','4','5'], datasets:[{ data:dist, backgroundColor:['#FCA5A5','#FCD34D','#FDE68A','#6EE7B7','#34D399'], borderRadius:6, borderSkipped:false }] },
    options:{ responsive:true, plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true,ticks:{stepSize:1,font:{size:10}},grid:{color:'#f0f4fa'}}, x:{ticks:{font:{size:10}},grid:{display:false}} } }
  });

  // 部員別件数
  const byName = {};
  store.reflects.forEach(r=>{ const n=getName(r); byName[n]=(byName[n]||0)+1; });
  const entries = Object.entries(byName).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const mc = document.getElementById('memberChart');
  if(charts.member) charts.member.destroy();
  charts.member = new Chart(mc, {
    type:'bar',
    data:{ labels:entries.map(e=>e[0]), datasets:[{ data:entries.map(e=>e[1]), backgroundColor:'#1a3560', borderRadius:6, borderSkipped:false }] },
    options:{ indexAxis:'y', responsive:true, plugins:{legend:{display:false}}, scales:{ x:{beginAtZero:true,ticks:{stepSize:1,font:{size:10}},grid:{color:'#f0f4fa'}}, y:{ticks:{font:{size:10}},grid:{display:false}} } }
  });

  renderMatrix();
  renderAllReflect();
}

function renderMatrix() {
  const r = store.reflects, d = store.declares;
  const wrap = document.getElementById('matrixWrap');
  if(!r.length && !d.length) { wrap.innerHTML='<div class="empty"><div class="empty-text">データがありません</div></div>'; return; }
  const dates = [...new Set([...r,...d].map(x=>normDate(x.date||x['稽古日'])).filter(Boolean))].sort().reverse().slice(0,8);
  const names = [...new Set([...r,...d].map(getName).filter(n=>n!=='—'))].sort();
  const rMap={}, dMap={};
  r.forEach(x=>{ const n=getName(x),dt=normDate(x.date||x['稽古日']); const f=getScore(x); if(!rMap[n])rMap[n]={}; if(!rMap[n][dt]||f>rMap[n][dt]) rMap[n][dt]=f; });
  d.forEach(x=>{ const n=getName(x),dt=normDate(x.date||x['稽古日']); if(!dMap[n])dMap[n]={}; dMap[n][dt]=true; });
  let h='<table class="mtx"><thead><tr><th class="n">部員</th>';
  dates.forEach(dt=>h+='<th>'+dt.slice(5)+'</th>');
  h+='</tr></thead><tbody>';
  names.forEach(name=>{
    h+=`<tr><td class="n">${name}</td>`;
    dates.forEach(dt=>{
      const s=rMap[name]?.[dt], dk=dMap[name]?.[dt];
      if(s) h+=`<td><div class="mc mc-${s}">${s}</div></td>`;
      else if(dk) h+=`<td><div class="mc mc-ok">✓</div></td>`;
      else h+=`<td><div class="mc mc-nil">—</div></td>`;
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  wrap.innerHTML=h;
}

function renderAllReflect() {
  const from = document.getElementById('dateFrom').value;
  const to   = document.getElementById('dateTo').value;
  let rows = filterByRange(store.reflects, from, to);
  rows = rows.slice().sort((a,b)=>normDate(b.date||b['稽古日']).localeCompare(normDate(a.date||a['稽古日'])));
  const el = document.getElementById('allReflectCards');
  if(!rows.length) { el.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🔍</div><div class="empty-text">該当データがありません</div></div>'; return; }
  el.innerHTML = rows.map(r=>buildReflectCard(r)).join('');
}

function buildReflectCard(row) {
  const n=getName(row), dt=normDate(row.date||row['稽古日']||'—');
  const s=row.scene||row['印象に残った場面']||'—';
  const w=row.why||row['なぜそうなったか']||'—';
  const i=row.intent||row['試したいこと']||'';
  const f=getScore(row);
  return `<div class="card">
    <div class="card-hdr reflect">
      <div class="card-av">${n.charAt(0)}</div>
      <div style="flex:1"><div class="card-name">${n}</div><div class="card-meta">${dt}</div></div>
      ${f?`<span class="achieve-pill ${apClass[f]}">${fL[f]}</span>`:''}
    </div>
    <div class="card-body">
      ${i?`<div class="card-section"><div class="card-sec-label lbl-declare">✊ チャレンジ宣言</div><div class="chip chip-declare">${i}</div></div>`:''}
      <div class="card-section"><div class="card-sec-label lbl-scene">① 場面</div><div class="chip chip-scene">${s}</div></div>
      <div class="card-section"><div class="card-sec-label lbl-why">② なぜ</div><div class="chip chip-why">${w}</div></div>
    </div>
  </div>`;
}

// ── アラート ──
function renderAlerts() {
  const low = latestPerMember(store.reflects).filter(r=>{ const f=getScore(r); return f>0&&f<=2; });
  const bar = document.getElementById('alertBar');
  if(low.length) {
    bar.className='alert-bar amber';
    bar.innerHTML='⚠ 達成感が低い部員がいます（' + low.map(getName).join('・') + '）。チャレンジの難易度を確認してください。';
  } else {
    bar.className='alert-bar hidden';
    bar.innerHTML='';
  }
}
</script>
</body>
